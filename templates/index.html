{% set _ = session.pop('toast', None) %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>User Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-50 to-slate-100 min-h-screen">

<!-- Toast -->
{% if session.get('toast') %}
<div id="toast"
     class="fixed top-6 right-6 px-6 py-3 rounded-xl shadow-xl text-white
     {% if session.toast[0] == 'success' %}
        bg-green-500
     {% else %}
        bg-red-500
     {% endif %}
     animate-slide-in">
  {{ session.toast[1] }}
</div>
{% endif %}

<header class="bg-white shadow-md px-10 py-6 flex justify-between items-center">
  <h1 class="text-2xl font-bold text-gray-800">👤 User Management</h1>
  <div class="space-x-3">
    <a href="{{ url_for('stats') }}"
       class="bg-white border border-indigo-600 text-indigo-600 hover:bg-indigo-50 px-5 py-2 rounded-xl font-semibold transition">
      📊 Stats
    </a>
    <a href="{{ url_for('query') }}"
       class="bg-white border border-indigo-600 text-indigo-600 hover:bg-indigo-50 px-5 py-2 rounded-xl font-semibold transition">
      🔎 Query Builder
    </a>
    <a href="{{ url_for('insert') }}"
       class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-xl font-semibold transition">
      + Add User
    </a>
  </div>
</header>

<main class="p-10">
  <div class="bg-white rounded-2xl shadow-xl overflow-hidden animate-fade-in">
    <table class="w-full text-center">
      <thead class="bg-gray-100 text-gray-600 uppercase text-sm">
        <tr>
          <th class="p-4">User ID</th>
          <th>Username</th>
          <th>Phone</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for user in users %}
        <tr class="border-t hover:bg-indigo-50 transition">
          <td class="p-4">{{ user[0] }}</td>
          <td>{{ user[1] }}</td>
          <td>{{ user[2] }}</td>
          <td class="space-x-3">
            <a href="{{ url_for('update', userId=user[0]) }}"
               class="px-4 py-1 rounded-lg bg-indigo-100 text-indigo-700 font-semibold hover:bg-indigo-200">
              Edit
            </a>
            <a href="{{ url_for('delete', userId=user[0]) }}"
               class="px-4 py-1 rounded-lg bg-red-100 text-red-600 font-semibold hover:bg-red-200">
              Delete
            </a>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</main>

<script>
  // Toast logic
  if (sessionStorage.getItem("success")) {
    const toast = document.getElementById("toast");
    toast.classList.remove("hidden");
    setTimeout(() => toast.classList.add("hidden"), 3000);
    sessionStorage.removeItem("success");
  }
</script>

<style>
@keyframes slide-in {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}
.animate-slide-in {
  animation: slide-in 0.4s ease-out;
}
@keyframes fade-in {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.animate-fade-in {
  animation: fade-in 0.5s ease-out;
}
</style>

</body>
</html>



<script>
  setTimeout(() => {
    const toast = document.getElementById("toast");
    if (toast) toast.remove();
  }, 3000);
</script>
